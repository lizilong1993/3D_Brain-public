seed: 42
device: cpu
batch_size: 64
seq_len: 64
train_steps: 30000
val_interval: 500
checkpoint_interval: 1500
lr: 0.001

num_nodes: 128
num_surface: 32
num_interior: 96
edge_budget: 960
surface_degree_limit: 18
interior_degree_limit: 20

input_dim: 12
obs_dim: 10
memory_num_classes: 8
control_num_classes: 5
control_action_bins: [-1.0, -0.5, 0.0, 0.5, 1.0]

rewire_every: 150
rewire_fraction: 0.05
warmup_steps: 1500

lambda_pred: 1.0
lambda_mem: 1.0
lambda_ctrl: 1.5
lambda_len: 0.0001
lambda_surf: 0.0002

memory_delay: 12
danger_threshold: 0.8
control_horizon: 1
obs_noise_std: 0.05
world_type: B
enable_control_loss: true

validation_batches: 8
analysis_weight_quantile: 0.85
